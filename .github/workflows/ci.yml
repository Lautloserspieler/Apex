name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build
      - name: Cache Catch2 sources
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: apex-tests-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}
      - name: Test standard-library Phase 2 benchmark parser
        run: python3 -m unittest discover -s benchmarks/tests -p 'test_*.py' -v
      - name: Configure CPU-only mock build
        run: cmake --preset cpu-release -DFETCHCONTENT_BASE_DIR="${GITHUB_WORKSPACE}/.cache/fetchcontent"
      - name: Build
        run: cmake --build --preset cpu-release --parallel 2
      - name: Test
        run: ctest --preset cpu-release --output-on-failure

  windows-x64:
    name: windows-x64
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC x64, build and test
        shell: pwsh
        run: |
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio installer not found" }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC C++ x64 tools not found" }
          $vcvars = Join-Path $installation "VC/Auxiliary/Build/vcvars64.bat"
          $command = 'call "' + $vcvars + '" && cmake --preset cpu-release && cmake --build --preset cpu-release --parallel 2 && ctest --preset cpu-release --output-on-failure'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


  windows-real-gguf:
    name: windows-real-gguf
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Cache pinned llama.cpp and Catch2 sources
        uses: actions/cache@v4
        with:
          path: .cache/windows-inference-fetchcontent
          key: apex-windows-real-b12445-sha256-5dc44685-catch2-v3.5.2
      - name: Configure and compile real backend under MSVC x64
        shell: pwsh
        run: |
          $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "Visual Studio installer not found" }
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw "MSVC C++ x64 tools not found" }
          $vcvars = Join-Path $installation "VC/Auxiliary/Build/vcvars64.bat"
          $deps = Join-Path $env:GITHUB_WORKSPACE ".cache/windows-inference-fetchcontent"
          $command = 'call "' + $vcvars + '" && cmake --preset cpu-inference -DFETCHCONTENT_BASE_DIR="' + $deps + '" && cmake --build --preset cpu-inference --parallel 2'
          & cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and verify pinned GGUF fixture
        shell: pwsh
        run: |
          $modelDir = Join-Path $env:RUNNER_TEMP "apex-models"
          New-Item -ItemType Directory -Path $modelDir -Force | Out-Null
          $model = Join-Path $modelDir "TinyStories-656K-Q4_K_M.gguf"
          Invoke-WebRequest -Uri "https://huggingface.co/tensorblock/TinyStories-656K-GGUF/resolve/3099aa586494d47fcc8a64f71528539c9384915f/TinyStories-656K-Q4_K_M.gguf?download=true" -OutFile $model
          $actual = (Get-FileHash -Algorithm SHA256 $model).Hash.ToLowerInvariant()
          $expected = "bc31753cc99ac43a6b611b1e390c6054e1e6a32b3b0c3090fe36ac018f8389b4"
          if ($actual -ne $expected) { throw "GGUF checksum mismatch: $actual" }
          Add-Content -Path $env:GITHUB_ENV -Value "APEX_TEST_MODEL=$model"
      - name: Run real model integration tests and generation
        shell: pwsh
        run: |
          ctest --preset cpu-inference --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ".\build\cpu-inference\apex.exe" --model "$env:APEX_TEST_MODEL" --prompt "Once upon a time" --ctx-size 256 --max-tokens 8 --temperature 0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python benchmarks/compare_reference.py --apex ".\build\cpu-inference\\apex.exe" --reference ".\build\cpu-inference\\apex_llama_reference.exe" --model "$env:APEX_TEST_MODEL" --prompt "Once upon a time" --ctx-size 256 --max-tokens 16
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  inference-backend:
    name: inference-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git
      - name: Cache pinned upstream sources
        uses: actions/cache@v4
        with:
          path: .cache/inference-fetchcontent
          key: apex-inference-b12445-sha256-5dc44685-catch2-v3.5.2-${{ runner.os }}
      - name: Configure real GGUF backend
        run: cmake --preset cpu-inference -DFETCHCONTENT_BASE_DIR="${GITHUB_WORKSPACE}/.cache/inference-fetchcontent"
      - name: Confirm pinned archive contains no Git history
        run: |
          test -f ".cache/inference-fetchcontent/llama_cpp-src/CMakeLists.txt"
          test ! -d ".cache/inference-fetchcontent/llama_cpp-src/.git"
      - name: Compile reference backend and Apex
        run: cmake --build --preset cpu-inference --parallel 2
      - name: Run no-model unit tests
        run: ctest --preset cpu-inference --output-on-failure
      - name: Download pinned tiny GGUF fixture (less than 1 MB)
        run: |
          mkdir -p "$RUNNER_TEMP/apex-models"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$RUNNER_TEMP/apex-models/TinyStories-656K-Q4_K_M.gguf" \
            "https://huggingface.co/tensorblock/TinyStories-656K-GGUF/resolve/3099aa586494d47fcc8a64f71528539c9384915f/TinyStories-656K-Q4_K_M.gguf?download=true"
          test "$(stat -c%s "$RUNNER_TEMP/apex-models/TinyStories-656K-Q4_K_M.gguf")" -gt 100000
          echo "bc31753cc99ac43a6b611b1e390c6054e1e6a32b3b0c3090fe36ac018f8389b4  $RUNNER_TEMP/apex-models/TinyStories-656K-Q4_K_M.gguf" | sha256sum -c -
      - name: End-to-end token generation with GGUF model
        env:
          APEX_TEST_MODEL: ${{ runner.temp }}/apex-models/TinyStories-656K-Q4_K_M.gguf
        run: |
          ctest --preset cpu-inference --output-on-failure
          ./build/cpu-inference/apex \
            --model "$APEX_TEST_MODEL" --prompt "Once upon a time" \
            --ctx-size 256 --max-tokens 8 --temperature 0
          python3 benchmarks/compare_reference.py \
            --apex ./build/cpu-inference/apex \
            --reference ./build/cpu-inference/apex_llama_reference \
            --model "$APEX_TEST_MODEL" --prompt "Once upon a time" \
            --ctx-size 256 --max-tokens 16
      - name: Phase 3 benchmark matrix smoke (correctness-gated, not a perf claim)
        env:
          APEX_TEST_MODEL: ${{ runner.temp }}/apex-models/TinyStories-656K-Q4_K_M.gguf
        run: |
          python3 benchmarks/phase3_bench.py \
            --apex ./build/cpu-inference/apex \
            --reference ./build/cpu-inference/apex_llama_reference \
            --model "$APEX_TEST_MODEL" --label ci-tinystories \
            --prompt short=benchmarks/phase3_prompts/short.txt \
            --ctx-sizes 128,256 --max-tokens 16 --threads 1,2 \
            --processes 2 --repeat 3 --out "$RUNNER_TEMP/apex-bench"
          cat "$RUNNER_TEMP"/apex-bench/*/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Phase 3 benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-bench-ci-tinystories
          path: ${{ runner.temp }}/apex-bench
          if-no-files-found: ignore
          retention-days: 30
