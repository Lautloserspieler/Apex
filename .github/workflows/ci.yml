name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build

      - name: Cache Catch2 sources
        uses: actions/cache@v4
        with:
          path: .cache/fetchcontent
          key: apex-catch2-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure CPU Release
        run: cmake --preset cpu-release -DFETCHCONTENT_BASE_DIR="${GITHUB_WORKSPACE}/.cache/fetchcontent"

      - name: Build
        run: cmake --build --preset cpu-release --parallel 2

      - name: Test
        run: ctest --preset cpu-release --output-on-failure
